const partnerOf = id => (id === "maggie" ? "martin" : "maggie");

const stats = { frames: 0, draws: 0 };

function freshWalk() {
  const badge = () => ({ known: { ...BASE }, shared: { ...BASE }, shown: BASE.maggie + BASE.martin, anim: null, toast: null, stepUntil: 0 });
  return { inRange: true, badges: { maggie: badge(), martin: badge() } };

const sharedTotalOf = id => { const s = walk.badges[id].shared; return s.maggie + s.martin; };

const auto = () => settings.sharingMode === "automatic";

function animateTo(id, delay) {
  const b = walk.badges[id];
  const to = sharedTotalOf(id);
  if (b.shown === to) { b.anim = null; return; }
  if (REDUCED) { b.shown = to; b.anim = null; return; }

}

function exchange(kind) {
  const merged = {};
  IDS.forEach(w => { merged[w] = Math.max(...IDS.map(id => walk.badges[id].known[w])); });
  IDS.forEach(id => {
    const b = walk.badges[id];
    const p = partnerOf(id);
    const gained = merged[p] - b.shared[p];
    b.known = { ...merged };
    b.shared = { ...merged };
    animateTo(id, gained > 0 ? 150 : 0);
    if (gained > 0) b.toast = { text: `+${fmt(gained)} FROM ${UPPER[p]}`, color: C.green, until: now() + TOAST_MS };

  });
}

function addSteps(id, n) {

  b.known[id] += n;

function applySetting(key, value) {

  if (key === "sharingMode") {

  for (let i = 1; i < dusk.length; i++) { const y = top + Math.floor(i * bh) - 1; for (let x = i % 2; x < 160; x += 2) P.px(x, y, dusk[i]); }
  P.disc(26, 84, 5, C.sun);
  for (let x = 0; x < 124; x++) { const y = Math.round(hor - 4 - 3 * Math.sin(x * 0.08 + 0.5) - 2 * Math.sin(x * 0.21)); P.rect(x, y, 1, hor - y, C.mtn); }
  P.rect(124, 85, 36, 4, C.sea);
  P.rect(130, 86, 3, 1, C.sea2); P.rect(150, 87, 4, 1, C.sea2);
  P.rect(0, hor, 160, 32, C.g2);
  P.rect(0, 106, 160, 14, C.g3);
  for (let x = 1; x < 160; x += 2) P.px(x, 106, C.g2);
  for (let k = 0; k < 18; k++) P.px(Math.floor(hash(k + 1000) * 160), 90 + Math.floor(hash(k + 1100) * 28), hash(k + 1200) < 0.2 ? C.flowerA : C.tuft);
  drawLighthouse(P, 146, 91, 18);
  drawBeam(P, 146, 77, 18);
  const span = STRIP.x1 - STRIP.x0;
  for (let x = STRIP.x0; x <= STRIP.x1; x++) {
    const s = (x - STRIP.x0) / span;
    const col = s <= v.sharedProgress ? C.pathDone : s <= v.progress ? C.pending : C.path;
    const y = stripY(x);
    P.px(x, y - 1, C.pathEdge);
    P.rect(x, y, 1, 4, col);
    P.px(x, y + 4, C.pathEdge);
  }
  P.rect(STRIP.x1 + 1, stripY(STRIP.x1) - 1, 6, 4, C.path);
  const xAt = p => STRIP.x0 + p * span;
  const mx = xAt(v.progress);
  if (settings.walkers !== "current") {
    const d = pairOffsets("side", v.id);
    const gx = xAt(v.sharedProgress);
    drawFigures(P, "side", !walk.inRange
      ? [{ who: v.p, x: gx, y: stripY(gx) + 2, frame: 1, ghost: true }, { who: v.id, x: mx, y: stripY(mx) + 2, frame: v.frame }]
      : [{ who: v.p, x: mx - d, y: stripY(mx) + 1, frame: 1 - v.frame }, { who: v.id, x: mx + d, y: stripY(mx) + 2, frame: v.frame }]);
  } else if (!walk.inRange) {
    const gx = xAt(v.sharedProgress);
    drawWalker(P, v.p, gx, stripY(gx) + 2, 1, true);
    drawWalker(P, v.id, mx, stripY(mx) + 2, v.frame, false);
  } else {
    drawWalker(P, v.p, mx - 4, stripY(mx) + 1, 1 - v.frame, false);
    drawWalker(P, v.id, mx + 3, stripY(mx) + 2, v.frame, false);
  }
  const label = toGoText(v);
  P.rect(3, 63, P.textWidth(label) + 4, 10, C.ink);
  P.text(label, 5, 64, 1, C.white);
  P.rect(0, 59, 160, 1, C.panel);
}

const DRAW = { scenic: drawScenic, map: drawMap, hybrid: drawHybrid };
function drawBadge(id, canvas) {
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  const P = painter(ctx);
  P.rect(0, 0, 160, 120, C.ink);
  DRAW[settings.version](P, view(id));
  stats.draws++;
}

/* ---------- page ---------- */
const $ = id => document.getElementById(id);
const root = $("bw");
const pair = $("pair");
const cards = {};
IDS.forEach(id => {
  const col = document.createElement("div");
  col.className = "bw-badge";
  col.innerHTML = `<canvas class="bw-screen" width="160" height="120" role="img"></canvas>`;
  const person = document.createElement("div");
  person.className = "bw-person";
  person.innerHTML = `<span class="bw-name"><span class="bw-swatch" style="background:${SWATCH[id]}" aria-hidden="true"></span>${NAMES[id]}</span>
    <span class="bw-steps" role="group" aria-label="Add steps to ${NAMES[id]}'s badge">
      <button class="artifact-button" type="button" data-size="small" data-variant="outline" data-n="50" aria-label="Add 50 steps to ${NAMES[id]}">+50 steps</button>
      <button class="artifact-button" type="button" data-size="small" data-variant="outline" data-n="150" aria-label="Add 150 steps to ${NAMES[id]}">+150 steps</button>
    </span>`;
  col.appendChild(person);
  pair.appendChild(col);
  cards[id] = { col, canvas: col.querySelector("canvas"), person };
  person.querySelectorAll("button[data-n]").forEach(btn => btn.addEventListener("click", () => { addSteps(id, Number(btn.dataset.n)); render(); }));
});

function fitScreens() {
  const dpr = window.devicePixelRatio || 1;
  const gap = parseFloat(getComputedStyle(pair).columnGap) || 0;
  const cell = (pair.clientWidth - gap) / 2;
  const scale = Math.floor((cell * dpr) / 160);
  pair.style.setProperty("--screen-w", scale >= 2 ? `${(scale * 160) / dpr}px` : "100%");
  pair.dataset.scale = scale >= 2 ? String(scale) : "fit";
}
if ("ResizeObserver" in window) new ResizeObserver(fitScreens).observe(pair);
fitScreens();

function arrange() {
  root.dataset.arrangement = settings.version;
}

function report() {
  if (typeof host.report === "function") host.report({ version: settings.version, sharingMode: settings.sharingMode, walkers: settings.walkers });
}
document.querySelectorAll("[data-setting]").forEach(group => {
  const key = group.dataset.setting;
  group.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => {
    if (!applySetting(key, btn.dataset.v)) return;
    report();
    render();
  }));
});
if (typeof host.onSettings === "function") host.onSettings(values => { if (applySettings(values)) render(); });

$("move").addEventListener("click", () => { toggleRange(); render(); });
$("sync").addEventListener("click", () => { syncNow(); render(); });
$("sample").addEventListener("click", () => { IDS.forEach(id => { const short = SAMPLE_ADD[id] - localOf(id); if (short > 0) addSteps(id, short); }); render(); });
$("reset").addEventListener("click", () => { walk = freshWalk(); render(); });

function render() {
  arrange();
  document.querySelectorAll("[data-setting]").forEach(group => {
    const val = settings[group.dataset.setting];
    group.querySelectorAll("button").forEach(btn => btn.setAttribute("aria-pressed", String(btn.dataset.v === val)));
  });
  const syncing = walk.inRange && !auto();
  const pending = pendingExchange();
  const state = !walk.inRange ? "out" : syncing && pending ? "wait" : "in";
  $("status").dataset.state = state;
  $("statusText").textContent = { out: "Out of range", wait: "In range · not synced", in: "In range" }[state];
  $("move").textContent = walk.inRange ? "Walk apart" : "Meet up";
  $("move").dataset.variant = syncing && pending ? "outline" : "primary";
  $("sync").hidden = !syncing;
  $("sync").dataset.variant = pending ? "primary" : "outline";
  const atSample = IDS.every(id => localOf(id) >= SAMPLE_ADD[id]);
  $("sample").hidden = walk.inRange || atSample;
  $("sample").textContent = `Sample walk: +${SAMPLE_ADD.maggie} / +${SAMPLE_ADD.martin}`;
  $("sample").setAttribute("aria-label", `Add sample steps: Maggie +${SAMPLE_ADD.maggie}, Martin +${SAMPLE_ADD.martin}`);
  IDS.forEach(id => {
    const local = localOf(id);
    const where = !walk.inRange ? "out of range" : syncing && pending ? "in range, waiting for Sync" : `in range of ${NAMES[partnerOf(id)]}`;
    cards[id].canvas.setAttribute("aria-label", `${NAMES[id]}'s badge: ${fmt(sharedTotalOf(id))} of ${fmt(GOAL)} steps ${local > 0 || !walk.inRange ? "last shared" : "shared"}${local > 0 ? `, +${fmt(local)} new steps not yet shared` : ""}; ${where}`);
  });
  paint();
}

/* ---------- render on change; animate only active transitions ---------- */
let rafId = 0, toastTimer = 0, onScreen = true;
const visible = () => onScreen && document.visibilityState !== "hidden";
const animating = () => !REDUCED && IDS.some(id => { const b = walk.badges[id]; return b.anim || now() < b.stepUntil; });
function drawAll() { IDS.forEach(id => drawBadge(id, cards[id].canvas)); }
function tick() {
  rafId = 0;
  if (!visible()) return;
  stats.frames++;
  drawAll();
  if (animating()) rafId = requestAnimationFrame(tick);
}
function scheduleToastExpiry() {
  clearTimeout(toastTimer);
  const t = now();
  const ends = IDS.map(id => walk.badges[id].toast).filter(x => x && x.until > t).map(x => x.until);
  if (ends.length) toastTimer = setTimeout(() => { if (visible()) paint(); }, Math.min(...ends) - t + 20);
}
function paint() {
  drawAll();
  if (visible() && animating() && !rafId) rafId = requestAnimationFrame(tick);
  scheduleToastExpiry();
}
document.addEventListener("visibilitychange", () => { if (visible()) paint(); else { cancelAnimationFrame(rafId); rafId = 0; } });
if ("IntersectionObserver" in window) new IntersectionObserver(entries => {
  onScreen = entries[entries.length - 1].isIntersecting;
  if (onScreen) paint(); else { cancelAnimationFrame(rafId); rafId = 0; }
}).observe(root);

applySample(host.sample);
render();
window.__badgeWalk = { settings, get walk() { return walk; }, overflow, stats, totalOf, sharedTotalOf, localOf, drawBadge, cards, get rafActive() { return rafId !== 0; }, get scale() { return pair.dataset.scale; } };
})();
</script>
