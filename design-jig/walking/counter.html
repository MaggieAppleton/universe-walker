<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Walking count</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@500&display=swap">
  <link rel="stylesheet" href="./vendor/dialkit.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eeece7;color:#35362f;font:14px/1.5 system-ui,sans-serif}
    main{max-width:820px;margin:40px auto;padding:0 24px 80px}h1{font-size:25px;letter-spacing:-.04em;font-weight:550;margin:0 0 8px}
    h2{font-size:15px;font-weight:550;margin:24px 0 10px}p{margin:0 0 18px;color:#77776c}
    .panel{background:white;padding:24px;overflow-x:auto;border-radius:8px;margin-bottom:24px}
    .pair{display:grid;grid-template-columns:320px 320px;gap:24px;justify-content:center;min-width:664px}
    .label{color:#929086;font-size:12px;margin-bottom:8px}canvas{width:320px;height:240px;display:block}
    .wearer{font-size:13px;font-weight:550;margin:18px 0 8px}.wearer:first-of-type{margin-top:0}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px}button,a{font:inherit;color:inherit}
    button{padding:7px 12px;border:1px solid #d4d2ca;background:#faf9f6;border-radius:6px;cursor:pointer}
    button:hover{background:white}button:focus-visible,a:focus-visible{outline:2px solid #c18d2c;outline-offset:3px}
    output{display:block;font-size:12px;color:#77776c;overflow-wrap:anywhere;margin:14px 0 6px}footer{font-size:12px;color:#77776c}
  </style>
</head>
<body>
  <main>
    <h1>Walking count</h1>
    <p>Take steps on either badge, then sync. Your new steps are large and yellow.</p>
    <div class="actions">
      <button id="maggie-step">Maggie +1</button><button id="martin-step">Martin +1</button>
      <button id="sync">Sync badges</button><button id="reset">Reset example</button>
    </div>
    <div id="live" class="panel"></div>
    <h2>Fit checks</h2>
    <div id="checks" class="panel"></div>
    <footer>
      <button id="copy">Copy chosen values</button>
      <output id="values"></output><span id="message" role="status"></span>
      <p><a href="./fresh.html#all-states">All 24 states, both badges</a></p>
    </footer>
  </main>
  <script src="./vendor/dialkit.js"></script>
  <script src="./fresh/painter.js"></script><script src="./fresh/states.js"></script>
  <script src="./fresh/worlds.js"></script><script src="./fresh/events.js"></script>
  <script src="./fresh/directions.js"></script><script src="./counter.js"></script>
</body>
</html>
